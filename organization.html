<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up institution — CarboTrack</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="css/style.css"><style>.setup{width:min(700px,calc(100% - 32px));margin:45px auto}.setup .panel{padding:28px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;font-weight:700}.field input,.field select{padding:13px;border:1px solid #dce3d8;border-radius:6px;font:13px 'DM Sans'}@media(max-width:600px){.fields{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-symbol">C</span><span>carbo<span class="brand-accent">track</span></span></a><nav class="main-nav"><a href="dashboard.html">Dashboard</a></nav></header><main class="setup"><div class="eyebrow">INSTITUTION REGISTRATION</div><section class="panel"><h1 class="page-title">Create your campus<br><em>workspace.</em></h1><p class="page-intro">Set the organisation boundary for your institutional emissions inventory. You can register individual buildings and facilities after this step.</p><form id="org-form"><div class="fields"><div class="field" style="grid-column:1/-1"><label>Institution name</label><input id="name" required minlength="2" placeholder="e.g. Amity University Jharkhand"></div><div class="field"><label>Institution type</label><select id="type"><option>University</option><option selected>College</option><option>School</option><option>Hospital</option><option>Other institution</option></select></div><div class="field"><label>City</label><input id="city" placeholder="Ranchi"></div><div class="field"><label>State</label><input id="state" placeholder="Jharkhand"></div><div class="field"><label>Reporting year</label><input id="year" type="number" min="2000" max="2100" value="2026" disabled></div></div><button class="btn btn-green" type="submit" style="margin-top:22px">Create institution workspace ↗</button><p id="msg" role="status"></p></form></section></main><script src="js/config.js"></script><script>
(async()=>{const c=window.CARBOTRACK_CONFIG,sup=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey),{data:{user}}=await sup.auth.getUser();if(!user){location.href='auth.html';return}document.getElementById('org-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const {data,error}=await sup.rpc('create_carbotrack_organization',{p_name:document.getElementById('name').value,p_type:document.getElementById('type').value,p_city:document.getElementById('city').value,p_state:document.getElementById('state').value});document.getElementById('msg').textContent=error?error.message:'Workspace created. Redirecting to facility setup…';if(error)b.disabled=false;else location.href='facilities.html'})})();
</script><script src="js/theme.js"></script></body></html>
