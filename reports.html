<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports — CarboTrack</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html">C carbo<span>track</span></a><nav><a href="dashboard.html">Dashboard</a><a href="data-entry.html">Data entry</a><a class="active" href="reports.html">Reports</a></nav></header><main class="page-wrap"><div class="eyebrow">INSTITUTIONAL GHG DISCLOSURE</div><h1 class="page-title">Inventory reports</h1><p class="page-intro">Export activity records with source and emission-factor metadata for review.</p><section class="panel"><button class="btn btn-green" id="export">Export activity register CSV ↓</button><p id="report-message"></p><div style="overflow:auto"><table style="width:100%;font-size:11px;text-align:left"><thead><tr><th>Date</th><th>Facility</th><th>Activity</th><th>Scope</th><th>Quantity</th><th>kg CO₂e</th><th>Factor status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="js/config.js"></script><script src="js/institution.js"></script><script>
(async()=>{const st=await CT.requireOrganization();if(!st)return;const {data,error}=await st.sb.from('activity_records').select('activity_date,period_month,quantity,activity_unit,emissions_kg_co2e,reference_note,facilities(name),emission_factors(label,scope,source_name,source_year,factor_status,kg_co2e_per_unit)').eq('organization_id',st.org.id).order('activity_date');if(error){CT.message(error.message);return}const rows=data||[];document.getElementById('rows').innerHTML=rows.map(r=>'<tr><td>'+r.activity_date+'</td><td>'+(r.facilities?.name||'Unassigned')+'</td><td>'+r.emission_factors.label+'</td><td>'+r.emission_factors.scope+'</td><td>'+r.quantity+' '+r.activity_unit+'</td><td>'+Number(r.emissions_kg_co2e).toFixed(2)+'</td><td>'+r.emission_factors.factor_status+'</td></tr>').join('')||'<tr><td colspan="7">No activity records yet.</td></tr>';document.getElementById('export').onclick=()=>{const vals=[['Date','Month','Facility','Activity','Scope','Quantity','Unit','Factor kg CO2e/unit','Emissions kg CO2e','Factor source','Factor year','Factor status','Reference'],...rows.map(r=>[r.activity_date,r.period_month,r.facilities?.name||'Unassigned',r.emission_factors.label,r.emission_factors.scope,r.quantity,r.activity_unit,r.emission_factors.kg_co2e_per_unit,r.emissions_kg_co2e,r.emission_factors.source_name,r.emission_factors.source_year,r.emission_factors.factor_status,r.reference_note])];const csv=vals.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=url;a.download='carbotrack-institutional-register.csv';a.click();URL.revokeObjectURL(url)}})();
</script><script src="js/theme.js"></script></body></html>
